<html>
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>
        <section class="container py-4">
            <div class="row">
                <div class="col-md-9">
                    <div class="card">
                        <div class="card-header"><h4 class="mb-0">[[#{cita.listado}]]</h4></div>
                        <div class="card-body">
                            <div class="table-responsive" th:if="${citas != null and !citas.empty}">
                                <table class="table table-striped table-hover align-middle">
                                    <thead class="table-primary">
                                        <tr>
                                            <th>#</th>
                                            <th>[[#{cita.mascota}]]</th>
                                            <th>[[#{cita.propietario}]]</th>
                                            <th>[[#{cita.fecha}]]</th>
                                            <th>[[#{cita.servicio}]]</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="c : ${citas}">
                                            <td>[[${c.id}]]</td>
                                            <td>[[${c.nombreMascota}]]</td>
                                            <td>[[${c.nombrePropietario}]]</td>
                                            <td>[[${#temporals.format(c.fecha, 'dd/MM/yyyy')}]]</td>
                                            <td>[[${c.servicio.nombre}]]</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="text-center p-2" th:if="${citas == null or citas.empty}">
                                <span>[[#{lista.vacia}]]</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mt-3 mt-md-0">
                    <div class="card text-center text-bg-primary">
                        <div class="card-body">
                            <h3 class="h5">[[#{cita.total}]]</h3>
                            <p class="fs-2 mb-0"><i class="fa-solid fa-calendar-days"></i> [[${totalCitas}]]</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
